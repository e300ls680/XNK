<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星空 · 许愿</title>
<meta property="og:title" content="星空 · 许愿">
<meta property="og:description" content="把今晚的流星留给一个愿望。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#04060c;
  --s1:rgba(255,255,255,.035);
  --s2:rgba(255,255,255,.09);
  --ink:#e9edf6;
  --ink-soft:#a8b2c7;
  --ink-muted:#6b7689;
  --rule:#2b3444;
  --voltage:#ffd27d;
  --star-cold:#cfe0ff;
  --cyan:#22d3ee;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --script:"Ma Shan Zheng","Xingkai SC",cursive;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--canvas);color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overscroll-behavior:none;
  font-family:var(--sans);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0}
button{cursor:pointer}

/* ---------- sky ---------- */
#sky{position:fixed;inset:0;display:block;z-index:0}
#flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:rgba(220,232,255,.22)}
#chip{position:fixed;left:0;top:0;z-index:40;display:flex;align-items:center;gap:9px;
  pointer-events:none;opacity:0;will-change:transform;white-space:nowrap}
#chip .ct{font-family:var(--serif);font-size:11px;letter-spacing:.04em;color:var(--ink);opacity:.82}
#chip .cd{width:6px;height:6px;border-radius:9999px;background:var(--voltage);flex:none}

/* ---------- plate rules + meridian ---------- */
.rule{position:fixed;left:0;right:0;height:1px;background:var(--rule);z-index:2;opacity:.85}
.rule-top{top:calc(64px + var(--sat))}
.rule-bottom{bottom:calc(148px + var(--sab))}

.frame{position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw,560px);height:100%;height:100dvh;z-index:3}

.meridian{position:absolute;left:26px;top:calc(64px + var(--sat));
  bottom:calc(148px + var(--sab));width:1px;background:var(--rule);overflow:visible;z-index:2}
.track{position:absolute;left:0;top:-300px;width:1px;height:calc(100% + 600px);
  animation:drift 50s linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-300px)}}
.tickrow{position:absolute;left:0;width:26px;height:1px}
.tickrow i{position:absolute;right:1px;top:0;height:1px;background:var(--rule)}
.tickrow i.s{width:8px}
.tickrow i.l{width:20px;background:var(--cyan);opacity:.55}
.tickrow span{position:absolute;left:8px;top:-5px;font-family:var(--mono);font-size:8px;
  letter-spacing:.14em;color:var(--ink-muted);opacity:.55;font-variant-numeric:tabular-nums}

/* ---------- nav ---------- */
.nav{position:absolute;top:0;left:0;right:0;height:calc(64px + var(--sat));
  padding:var(--sat) 18px 0 64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-title{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.14em;color:var(--ink)}
.nav-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.nav-meta .row{display:flex;align-items:center;gap:10px}
.mono{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-muted)}
.mono.num{letter-spacing:.14em;font-variant-numeric:tabular-nums;text-transform:none}
.nav-meta .link{color:var(--ink-soft);letter-spacing:.12em;text-transform:none;
  font-family:var(--sans);font-size:11px;padding-bottom:2px;border-bottom:1px solid var(--rule)}
.dot{width:3px;height:3px;background:var(--rule);flex:none}

/* ---------- hero ---------- */
.hero{position:absolute;left:64px;top:21vh;max-width:min(62vw,430px)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,7.2vw,46px);
  line-height:1.24;letter-spacing:.06em;color:var(--ink)}
.hero .sub{margin-top:20px;font-family:var(--serif);font-size:14px;line-height:1.78;
  letter-spacing:.04em;color:var(--ink-muted)}

/* ---------- ledger fan ---------- */
.ledger{position:absolute;inset:0;pointer-events:none}
.wish{position:absolute;right:18px;top:38vh;width:min(52vw,224px);text-align:right;
  transform-origin:100% 130%;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .42s ease}
.wish-in{transition:transform .26s cubic-bezier(.2,.8,.2,1);will-change:transform}
.wish .body{font-family:var(--serif);font-size:14px;line-height:1.78;letter-spacing:.04em;
  color:var(--ink-soft)}
.wish .q{color:var(--ink-muted);font-family:var(--serif);font-size:14px}
.wish:not(.latest) .q{display:none}
.wish.latest .body{color:var(--ink)}
.wish time{display:block;margin-top:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.caret{display:inline-block;width:1px;height:14px;background:var(--voltage);
  vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* ---------- terminal ---------- */
.terminal{position:absolute;left:64px;right:18px;bottom:calc(18px + var(--sab))}
.count-line{text-align:right;font-family:var(--serif);font-size:11px;letter-spacing:.04em;
  color:var(--ink-muted);margin-bottom:11px}
.count-line b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;
  color:var(--ink-soft);font-variant-numeric:tabular-nums;transition:color .5s ease}
.count-line b.hot{color:var(--voltage);transition:color .12s linear}
.bar{height:56px;background:var(--s1);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 6px 0 18px}
.bar input{flex:1;min-width:0;font-family:var(--sans);font-size:15px;letter-spacing:.02em;
  color:var(--ink)}
.bar input::placeholder{color:var(--ink-muted)}
.pill{width:44px;height:44px;flex:none;border-radius:9999px;background:var(--s2);
  display:grid;place-items:center;transition:transform .09s linear,background .2s ease}
.pill svg{stroke:var(--ink-muted);transition:stroke .18s ease}
.pill.on svg{stroke:var(--voltage)}
.pill:active{transform:scale(.94)}
.pill.spring{animation:spring .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes spring{from{transform:scale(.94)}to{transform:scale(1)}}

/* ---------- edge chips ---------- */
.edge{position:absolute;right:0;writing-mode:vertical-rl;font-family:var(--mono);
  font-size:10px;font-weight:500;letter-spacing:.32em;color:var(--ink-muted);
  padding:10px 6px;border-left:1px solid var(--rule)}
.edge.a{top:68vh}
.edge.b{top:78vh}

/* ---------- sheets ---------- */
.sheet{position:fixed;left:50%;bottom:0;width:min(100vw,560px);transform:translate(-50%,101%);
  z-index:50;background:var(--s1);border-top:1px solid var(--rule);
  padding:32px 24px calc(28px + var(--sab));transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.08em;
  color:var(--ink);margin-bottom:18px}
.sheet p{font-family:var(--serif);font-size:14px;line-height:1.78;letter-spacing:.04em;
  color:var(--ink-soft);margin-bottom:12px}
.sheet .tech{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-muted);
  line-height:1.9;text-transform:uppercase}
.actions{display:flex;gap:28px;margin-top:26px;align-items:center}
.ghost{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.12em;
  color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--rule)}
.ghost:active{border-bottom-color:var(--ink-muted)}

/* ---------- constellation card ---------- */
.card{position:relative;border:1px solid var(--rule);background:var(--canvas);padding:22px 20px 18px}
.card .eyebrow{margin-bottom:16px}
.card .\boxed{position:relative;height:180px;margin:0 -4px}
.card svg{width:100%;height:100%;overflow:visible}
.card .sig{font-family:var(--script);font-size:22px;line-height:1.4;letter-spacing:.02em;
  color:var(--ink);margin-top:16px}
.card .foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.card img{display:block;width:100%;margin-top:4px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(172px + var(--sab));transform:translate(-50%,10px);
  z-index:70;background:var(--s2);border:1px solid var(--rule);padding:11px 18px;
  font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .track{animation:none}
  .caret{animation:none;opacity:.6}
  .wish,.wish-in{transition:none}
}
@media (max-width:340px){
  .nav-meta .row .zhr{display:none}
  .hero{left:56px}
  .terminal{left:56px}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="flash"></div>
<div class="rule rule-top"></div>
<div class="rule rule-bottom"></div>

<div class="frame">
  <div class="meridian"><div class="track" id="track"></div></div>

  <header class="nav">
    <div class="nav-title">星空 · 许愿</div>
    <div class="nav-meta">
      <div class="row">
        <span class="mono" id="navDate">2026 · 08 · 12</span>
        <i class="dot"></i>
        <span class="mono zhr">Perseids · ZHR 100</span>
      </div>
      <button class="link" id="openInChat">在聊天里打开</button>
    </div>
  </header>

  <section class="hero">
    <h1>把今晚的流星<br>留给一个愿望。</h1>
    <p class="sub">写下一个愿望，让它随一颗流星飞走。</p>
  </section>

  <section class="ledger" id="ledger"></section>

  <button class="edge a" id="edgeAbout">关于</button>
  <button class="edge b" id="edgeStar">星图</button>

  <footer class="terminal">
    <div class="count-line">今晚已有 <b id="count">2,417</b> 颗流星划过。</div>
    <form class="bar" id="bar" autocomplete="off">
      <input id="wishInput" type="text" maxlength="24" enterkeyhint="send"
             placeholder="许个愿，24 字以内" aria-label="许个愿，24 字以内">
      <button class="pill" id="send" type="submit" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.5 1.5 1.5 8.2l6.6 2.7 2.7 6.6 7.7-16Z"/><path d="M8.1 10.9 18.5 1.5"/>
        </svg>
      </button>
    </form>
  </footer>
</div>

<div id="chip"><span class="ct"></span><i class="cd"></i></div>

<aside class="sheet" id="helpSheet">
  <h2>关于</h2>
  <p>这是一个单页的流星雨。</p>
  <p>它没有服务器。你的愿望只存在这台手机里，和你发出去的那条链接里。</p>
  <p class="tech">Tech · Canvas 2D · 14 Stars · 62° Track · No Server</p>
  <div class="actions"><button class="ghost" id="helpClose">收起</button></div>
</aside>

<aside class="sheet" id="cardSheet">
  <div class="card" id="card">
    <p class="eyebrow mono" id="cardEyebrow">Constellation · Generated from 3 wishes</p>
    <div class="box" id="cardBox"></div>
    <p class="sig" id="cardSig"></p>
    <p class="foot mono" id="cardFoot"></p>
  </div>
  <img id="cardImg" alt="星图" hidden>
  <div class="actions">
    <button class="ghost" id="saveCard">保存星图</button>
    <button class="ghost" id="moreWish">再许一个</button>
  </div>
</aside>

<div id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ storage ============ */
var LS={
  get:function(k,d){try{var v=localStorage.getItem("xk."+k);return v===null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem("xk."+k,v)}catch(e){}}
};
function pad(n){return n<10?"0"+n:""+n}
function stamp(){var d=new Date();return pad(d.getMonth()+1)+"·"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ state ============ */
var params=new URLSearchParams(location.search);
var seed=parseInt(params.get("s")||LS.get("seed",""),10);
if(!seed){seed=Math.floor(Math.random()*1e9);LS.set("seed",seed)}
var count=parseInt(LS.get("count","2417"),10);
var wishes=[];
try{wishes=JSON.parse(LS.get("wishes","[]"))||[]}catch(e){wishes=[]}
var shared=params.get("w");
if(shared&&wishes.length===0){
  wishes.push({text:shared.slice(0,24),time:stamp(),shared:true});
}

/* ============ canvas sky ============ */
var cv=$("#sky"),ctx=cv.getContext("2d",{alpha:false});
var W=0,H=0,DPR=1,starLayer=document.createElement("canvas"),sctx=starLayer.getContext("2d");
var DIR={x:-Math.sin(118*Math.PI/180),y:-Math.cos(118*Math.PI/180)};
var rainDim=1,rainTarget=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  starLayer.width=cv.width;starLayer.height=cv.height;
  sctx.setTransform(DPR,0,0,DPR,0,0);
  paintStars();
}
function paintStars(){
  var rnd=mulberry32(seed);
  sctx.fillStyle="#04060c";sctx.fillRect(0,0,W,H);
  var n=Math.min(320,Math.round(W*H/1370));
  for(var i=0;i<n;i++){
    var x=rnd()*W,y=rnd()*H,r=.4+rnd()*1.2,a=.15+rnd()*.75;
    sctx.fillStyle="rgba(201,212,232,"+a.toFixed(3)+")";
    sctx.beginPath();sctx.arc(x,y,r,0,6.2832);sctx.fill();
  }
  if(reduced){
    for(var k=0;k<8;k++){
      var sx=W*(.1+rnd()*.9),sy=H*(.05+rnd()*.75),len=60+rnd()*160;
      var g=sctx.createLinearGradient(sx,sy,sx-DIR.x*len,sy-DIR.y*len);
      g.addColorStop(0,"rgba(255,255,255,.25)");g.addColorStop(1,"rgba(255,255,255,0)");
      sctx.strokeStyle=g;sctx.lineWidth=1.2;sctx.beginPath();
      sctx.moveTo(sx,sy);sctx.lineTo(sx-DIR.x*len,sy-DIR.y*len);sctx.stroke();
    }
  }
}

/* ---- ambient meteors ---- */
var meteors=[],spawnIn=600,fired=0;
function spawnMeteor(){
  var len=40+Math.random()*220,sp=90+Math.random()*130;
  meteors.push({
    x:W*(.12+Math.random()*1.05),y:-H*.14+Math.random()*H*.6,
    len:len,sp:sp,t:0,dur:900+Math.random()*700
  });
}
function drawMeteors(dt){
  var i,m;
  for(i=meteors.length-1;i>=0;i--){
    m=meteors[i];m.t+=dt;
    var p=m.t/m.dur;
    if(p>=1){meteors.splice(i,1);fired++;bumpCount();continue}
    m.x+=DIR.x*m.sp*dt/1000;m.y+=DIR.y*m.sp*dt/1000;
    var a=(p<.25?p/.25:(p>.72?(1-p)/.28:1))*.62*rainDim;
    var tx=m.x-DIR.x*m.len,ty=m.y-DIR.y*m.len;
    var g=ctx.createLinearGradient(tx,ty,m.x,m.y);
    g.addColorStop(0,"rgba(255,255,255,0)");
    g.addColorStop(.7,"rgba(207,224,255,"+(a*.32).toFixed(3)+")");
    g.addColorStop(1,"rgba(255,255,255,"+a.toFixed(3)+")");
    ctx.strokeStyle=g;ctx.lineWidth=1.2;ctx.beginPath();
    ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();
    var rg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,18);
    rg.addColorStop(0,"rgba(255,255,255,"+(a*.9).toFixed(3)+")");
    rg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(m.x,m.y,18,0,6.2832);ctx.fill();
  }
  if(!reduced){
    spawnIn-=dt;
    if(spawnIn<=0&&meteors.length<14){spawnMeteor();spawnIn=400+Math.random()*2600}
  }
}

/* ---- fireball ---- */
var fb=null;
function startFireball(){
  if(reduced){doFlash();return}
  fb={t:0,dur:780,ax:W*1.16,ay:-H*.30,L:Math.hypot(W*1.7,H*1.5)};
}
function drawFireball(dt){
  if(!fb)return;
  fb.t+=dt;
  var p=Math.min(1,fb.t/fb.dur),e=1-Math.pow(1-p,1.7);
  var hx=fb.ax+DIR.x*fb.L*e,hy=fb.ay+DIR.y*fb.L*e;
  var tail=Math.min(380,Math.min(1,fb.t/200)*380);
  var fade=fb.t>fb.dur?Math.max(0,1-(fb.t-fb.dur)/420):1;
  var tx=hx-DIR.x*tail,ty=hy-DIR.y*tail;
  var g=ctx.createLinearGradient(tx,ty,hx,hy);
  g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(.55,"rgba(207,224,255,"+(.30*fade).toFixed(3)+")");
  g.addColorStop(1,"rgba(255,255,255,"+(.95*fade).toFixed(3)+")");
  ctx.save();
  ctx.shadowBlur=40;ctx.shadowColor="rgba(255,210,125,"+(.75*fade).toFixed(3)+")";
  ctx.strokeStyle=g;ctx.lineWidth=2.5+3.5*p;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.restore();
  var r=42+22*p;
  var rg=ctx.createRadialGradient(hx,hy,0,hx,hy,r);
  rg.addColorStop(0,"rgba(255,255,255,"+(.95*fade).toFixed(3)+")");
  rg.addColorStop(.35,"rgba(255,210,125,"+(.45*fade).toFixed(3)+")");
  rg.addColorStop(1,"rgba(255,210,125,0)");
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(hx,hy,r,0,6.2832);ctx.fill();
  if(fb.t>fb.dur+420)fb=null;
}

/* ---- wish chip ---- */
var chip=null,chipEl=$("#chip");
function bez(p1,p2){
  return function(t){
    var lo=0,hi=1,u=t,x;
    for(var i=0;i<18;i++){
      u=(lo+hi)/2;
      x=3*(1-u)*(1-u)*u*p1+3*(1-u)*u*u*p2+u*u*u;
      if(x<t)lo=u;else hi=u;
    }
    u=(lo+hi)/2;
    return 3*(1-u)*(1-u)*u*p2+3*(1-u)*u*u*1+u*u*u;
  };
}
var easeArc=bez(.22,1);
function launchChip(text){
  var r=$("#bar").getBoundingClientRect();
  chip={t:0,dur:900,trail:[],
    x0:r.left+r.width*.30,y0:r.top+r.height*.5,
    x1:W*.80,y1:H*.46,x2:W*1.04,y2:-H*.12};
  chipEl.querySelector(".ct").textContent=text;
}
function quad(a,b,c,t){
  var u=1-t;
  return{x:u*u*a.x+2*u*t*b.x+t*t*c.x,y:u*u*a.y+2*u*t*b.y+t*t*c.y};
}
function drawChip(dt){
  if(!chip)return;
  chip.t+=dt;
  var p=Math.min(1,chip.t/chip.dur),e=easeArc(p);
  var pos=quad({x:chip.x0,y:chip.y0},{x:chip.x1,y:chip.y1},{x:chip.x2,y:chip.y2},e);
  chip.trail.push({x:pos.x,y:pos.y});
  if(chip.trail.length>18)chip.trail.shift();
  var i,n=chip.trail.length;
  for(i=1;i<n;i++){
    var a=(i/n)*.55*(p<.78?1:Math.max(0,1-(p-.78)/.22));
    ctx.strokeStyle="rgba(255,210,125,"+a.toFixed(3)+")";
    ctx.lineWidth=.6+2.2*(i/n);
    ctx.beginPath();ctx.moveTo(chip.trail[i-1].x,chip.trail[i-1].y);
    ctx.lineTo(chip.trail[i].x,chip.trail[i].y);ctx.stroke();
  }
  var sc=1-.65*p;
  chipEl.style.transform="translate("+pos.x+"px,"+pos.y+"px) translate(-50%,-50%) scale("+sc.toFixed(3)+")";
  chipEl.style.opacity=p<.78?1:Math.max(0,1-(p-.78)/.22);
  if(p>=1){chip=null;chipEl.style.opacity=0}
}

/* ============ loop ============ */
var last=performance.now();
function frame(now){
  var dt=Math.min(now-last,60);last=now;
  rainDim+=(rainTarget-rainDim)*Math.min(1,dt/320);
  ctx.globalCompositeOperation="source-over";
  ctx.drawImage(starLayer,0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  drawMeteors(dt);drawFireball(dt);drawChip(dt);
  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}

/* ============ meridian ticks ============ */
(function(){
  var track=$("#track"),html="",i;
  for(i=0;i<8;i++){
    var y=i*300;
    html+='<div class="tickrow" style="top:'+y+'px"><i class="l"></i><span>'+
      pad(Math.floor(i*5/60))+":"+pad((i*5)%60)+'</span></div>';
    for(var j=1;j<5;j++){
      html+='<div class="tickrow" style="top:'+(y+j*60)+'px"><i class="s"></i></div>';
    }
  }
  track.innerHTML=html;
})();

/* ============ ledger ============ */
var SLOTS=[
  {ty:"17.6vh",rot:"9deg",op:.55},
  {ty:"13.2vh",rot:"4.5deg",op:.65},
  {ty:"8.8vh",rot:"0deg",op:.75},
  {ty:"4.4vh",rot:"-4.5deg",op:.85},
  {ty:"0vh",rot:"-9deg",op:.95}
];
var ledger=$("#ledger"),nodes=[];
for(var i=0;i<5;i++){
  var art=document.createElement("article");
  art.className="wish";
  art.innerHTML='<div class="wish-in"><span class="q">「</span><span class="body"></span>'+
    '<span class="q">」</span><time></time></div>';
  ledger.appendChild(art);nodes.push(art);
  (function(node,idx){
    var inner=node.querySelector(".wish-in");
    function on(){
      if(parseFloat(node.style.opacity||0)<.2)return;
      inner.style.transform="translateY(-6px)";
      if(nodes[idx-1])nodes[idx-1].querySelector(".wish-in").style.transform="translateY(3px)";
      if(nodes[idx+1])nodes[idx+1].querySelector(".wish-in").style.transform="translateY(3px)";
    }
    function off(){
      nodes.forEach(function(n){n.querySelector(".wish-in").style.transform=""});
    }
    node.addEventListener("pointerenter",on);
    node.addEventListener("pointerdown",on);
    node.addEventListener("pointerleave",off);
    node.addEventListener("pointerup",off);
    node.addEventListener("pointercancel",off);
  })(art,i);
}
function typeInto(el,text,done){
  if(reduced){el.textContent=text;if(done)done();return}
  var step=Math.min(22,700/Math.max(1,text.length)),k=0;
  el.textContent="";
  var id=setInterval(function(){
    k++;el.textContent=text.slice(0,k);
    if(k>=text.length){clearInterval(id);if(done)done()}
  },step);
}
function updateLedger(typing){
  var n=wishes.length;
  nodes.forEach(function(node,idx){
    var slot=SLOTS[idx],wi=n-5+idx;
    if(wi<0||wi>=n){
      node.style.opacity=0;node.style.pointerEvents="none";
      node.classList.remove("latest");return;
    }
    var w=wishes[wi];
    node.style.opacity=slot.op;
    node.style.pointerEvents="auto";
    node.style.transform="translateY("+slot.ty+") rotate("+slot.rot+")";
    node.querySelector("time").textContent=w.time;
    var latest=(wi===n-1);
    node.classList.toggle("latest",latest);
    var body=node.querySelector(".body"),old=node.querySelector(".caret");
    if(old)old.parentNode.removeChild(old);
    if(typing&&latest){
      typeInto(body,w.text,function(){
        var c=document.createElement("i");c.className="caret";
        node.querySelector(".wish-in").appendChild(c);
      });
    }else{
      body.textContent=w.text;
    }
  });
}

/* ============ counter ============ */
var countEl=$("#count"),countTimer=null;
function updateCount(hot){
  countEl.textContent=count.toLocaleString("en-US");
  if(hot&&!reduced){
    countEl.classList.add("hot");
    clearTimeout(countTimer);
    countTimer=setTimeout(function(){countEl.classList.remove("hot")},1400);
  }
}
function bumpCount(){updateCount(true)}

/* ============ toast ============ */
var toastEl=$("#toast"),toastTimer=null;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove("on")},2600);
}

/* ============ flash ============ */
function doFlash(){
  var f=$("#flash");
  if(reduced){
    f.style.transition="opacity 120ms linear";f.style.opacity="1";
    setTimeout(function(){f.style.transition="opacity 300ms ease";f.style.opacity="0"},130);
    return;
  }
  f.style.transition="opacity 60ms linear";f.style.opacity="1";
  setTimeout(function(){
    f.style.transition="opacity 380ms ease-out";f.style.opacity="0";
  },70);
}

/* ============ send ============ */
var input=$("#wishInput"),sendBtn=$("#send"),flying=false,isComposing=false;
function refreshPill(){sendBtn.classList.toggle("on",input.value.trim().length>0)}
input.addEventListener("input",refreshPill);
input.addEventListener("compositionstart",function(){isComposing=true});
input.addEventListener("compositionend",function(){isComposing=false;refreshPill()});
input.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!isComposing){e.preventDefault();send()}
});
$("#bar").addEventListener("submit",function(e){e.preventDefault();send()});
sendBtn.addEventListener("click",function(){
  if(!reduced){sendBtn.classList.remove("spring");void sendBtn.offsetWidth;sendBtn.classList.add("spring")}
});

function send(){
  var text=input.value.trim();
  if(!text||flying)return;
  flying=true;
  input.value="";refreshPill();input.blur();
  if(!reduced)launchChip(text);
  setTimeout(function(){rainTarget=reduced?rainDim:.28},120);
  setTimeout(startFireball,620);
  setTimeout(doFlash,700);
  setTimeout(function(){
    var w={text:text,time:stamp()};
    wishes.push(w);
    if(wishes.length>40)wishes.shift();
    LS.set("wishes",JSON.stringify(wishes));
    updateLedger(true);
    count++;LS.set("count",count);updateCount(true);
    toast("愿望已随流星飞去。");
    flying=false;
    if(!shared){
      setTimeout(function(){
        if(wishes.filter(function(x){return !x.shared}).length===3)openCard();
      },700);
    }
  },reduced?260:1240);
  setTimeout(function(){rainTarget=1},reduced?400:1400);
}

/* ============ constellation card ============ */
var lastConst=null;
function buildConstellation(){
  var rnd=mulberry32(seed+wishes.length*977);
  var n=18+Math.floor(rnd()*7),pts=[],links=[],i;
  for(i=0;i<n;i++)pts.push({x:.08+rnd()*.84,y:.10+rnd()*.80});
  var used={0:true},cur=0;
  while(Object.keys(used).length<n){
    var best=-1,bd=9;
    for(i=0;i<n;i++){
      if(used[i])continue;
      var d=Math.hypot(pts[i].x-pts[cur].x,(pts[i].y-pts[cur].y)*.62);
      if(d<bd){bd=d;best=i}
    }
    if(best<0)break;
    links.push([cur,best]);used[best]=true;cur=best;
  }
  for(i=0;i<3;i++){
    var a=Math.floor(rnd()*n),b=Math.floor(rnd()*n);
    if(a!==b)links.push([a,b]);
  }
  return{pts:pts,links:links};
}
function openCard(){
  var sheet=$("#cardSheet"),box=$("#cardBox");
  lastConst=buildConstellation();
  var svgNS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 100 62");
  var i,l;
  for(i=0;i<lastConst.links.length;i++){
    var p=lastConst.pts[lastConst.links[i][0]],q=lastConst.pts[lastConst.links[i][1]];
    l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",(p.x*100).toFixed(2));l.setAttribute("y1",(p.y*62).toFixed(2));
    l.setAttribute("x2",(q.x*100).toFixed(2));l.setAttribute("y2",(q.y*62).toFixed(2));
    l.setAttribute("stroke","rgba(233,237,246,0.28)");
    l.setAttribute("stroke-width","1");
    l.setAttribute("vector-effect","non-scaling-stroke");
    svg.appendChild(l);
  }
  for(i=0;i<lastConst.pts.length;i++){
    var c=document.createElementNS(svgNS,"circle");
    c.setAttribute("cx",(lastConst.pts[i].x*100).toFixed(2));
    c.setAttribute("cy",(lastConst.pts[i].y*62).toFixed(2));
    c.setAttribute("r",(i%4===0?1.5:1).toFixed(1));
    c.setAttribute("fill","#e9edf6");
    c.setAttribute("opacity","0");
    svg.appendChild(c);
    (function(node,delay){
      if(reduced){node.setAttribute("opacity",".9");return}
      setTimeout(function(){
        node.style.transition="opacity 260ms ease";
        node.setAttribute("opacity",".9");
      },delay);
    })(c,i*20);
  }
  box.innerHTML="";box.appendChild(svg);

  if(!reduced){
    var lines=svg.querySelectorAll("line");
    for(i=0;i<lines.length;i++){
      (function(line,idx){
        var len=line.getTotalLength?line.getTotalLength():60;
        line.style.strokeDasharray=len;line.style.strokeDashoffset=len;
        requestAnimationFrame(function(){
          line.style.transition="stroke-dashoffset 900ms cubic-bezier(.22,1,.36,1) "+(idx*40)+"ms";
          line.style.strokeDashoffset=0;
        });
      })(lines[i],i);
    }
  }

  var mine=wishes.filter(function(w){return !w.shared});
  var latest=mine.length?mine[mine.length-1].text:"愿家人平安，愿我上岸。";
  $("#cardSig").textContent=latest;
  $("#cardEyebrow").textContent="Constellation · Generated from "+Math.max(3,mine.length)+" wishes";
  var d=new Date();
  $("#cardFoot").textContent=d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate())+
    " · 某地 · "+Math.max(3,mine.length)+" WISHES";
  $("#cardImg").hidden=true;$("#card").style.display="";
  sheet.classList.add("open");
}
function renderCardPNG(){
  var w=1080,h=1620,c=document.createElement("canvas");
  c.width=w;c.height=h;
  var x=c.getContext("2d");
  x.fillStyle="#04060c";x.fillRect(0,0,w,h);
  x.strokeStyle="#2b3444";x.lineWidth=2;x.strokeRect(56,56,w-112,h-112);
  x.fillStyle="#6b7689";x.font='500 24px "IBM Plex Mono",monospace';
  x.fillText($("#cardEyebrow").textContent.toUpperCase(),104,152);
  var box={x:104,y:280,w:w-208,h:660},i;
  x.strokeStyle="rgba(233,237,246,0.28)";x.lineWidth=2;
  for(i=0;i<lastConst.links.length;i++){
    var p=lastConst.pts[lastConst.links[i][0]],q=lastConst.pts[lastConst.links[i][1]];
    x.beginPath();x.moveTo(box.x+p.x*box.w,box.y+p.y*box.h);
    x.lineTo(box.x+q.x*box.w,box.y+q.y*box.h);x.stroke();
  }
  x.fillStyle="#e9edf6";
  for(i=0;i<lastConst.pts.length;i++){
    x.beginPath();x.arc(box.x+lastConst.pts[i].x*box.w,box.y+lastConst.pts[i].y*box.h,
      i%4===0?6:4,0,6.2832);x.fill();
  }
  x.fillStyle="#e9edf6";x.font='400 52px "Ma Shan Zheng",cursive';
  x.fillText($("#cardSig").textContent,104,1080);
  x.strokeStyle="#2b3444";x.lineWidth=1;
  x.beginPath();x.moveTo(104,1200);x.lineTo(w-104,1200);x.stroke();
  x.fillStyle="#6b7689";x.font='500 24px "IBM Plex Mono",monospace';
  x.fillText($("#cardFoot").textContent.toUpperCase(),104,1260);
  return c.toDataURL("image/png");
}
$("#saveCard").addEventListener("click",function(){
  try{
    var img=$("#cardImg");
    img.src=renderCardPNG();img.hidden=false;
    $("#card").style.display="none";
    toast("长按存图，发给那个人。");
  }catch(e){toast("长按卡片即可保存。")}
});
$("#moreWish").addEventListener("click",function(){
  $("#cardSheet").classList.remove("open");
  setTimeout(function(){input.focus()},320);
});
$("#edgeStar").addEventListener("click",function(){
  if($("#cardSheet").classList.contains("open"))$("#cardSheet").classList.remove("open");
  else openCard();
});

/* ============ share ============ */
function shareURL(){
  var last=wishes.length?wishes[wishes.length-1]:null;
  var u=location.origin+location.pathname+"?s="+seed;
  if(last)u+="&w="+encodeURIComponent(last.text)+"&t="+Date.now();
  return u;
}
function copyText(t){
  if(navigator.clipable&&navigator.clipboard){navigator.clipboard.writeText(t);return}
  var ta=document.createElement("textarea");
  ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
}
function share(){
  var url=shareURL();
  if(navigator.share){
    navigator.share({title:"星空 · 许愿",
      text:wishes.length?wishes[wishes.length-1].text:"把今晚的流星留给一个愿望。",
      url:url}).catch(function(){});
  }else{
    copyText(url);
    toast("链接已复制，去聊天框粘贴给那个人。");
  }
}
$("#openInChat").addEventListener("click",share);

/* ============ help ============ */
$("#edgeAbout").addEventListener("click",function(){$("#helpSheet").classList.add("open")});
$("#helpClose").addEventListener("click",function(){$("#helpSheet").classList.remove("open")});

/* ============ visibility ============ */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){rainTarget=.15}

$("#navDate").textContent=d.getFullYear()+" · "+pad(d.getMonth()+1)+" · "+pad(d.getDate());

if(window.wx&&window.wx.ready){
  try{

      var cfg={title:"星空 · 许愿",
        desc:"把今晚的流星留给一个愿望。",

      if(window.wx.updateAppMessageShareData)window.wx.updateAppMessageShareData(cfg);
      if(window.wx.updateTimelineShareData)window.wx.updateTimelineShareData(cfg);
    });
  }catch(e){}
}
})();
